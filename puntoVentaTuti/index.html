<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Punto de Venta</title>
    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete"
    />

    <script src="script.js" defer></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      defer
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <h1>Punto de Venta Tuti-ISTLC</h1>
    <div class="container">
      <div class="row">
        <div class="col">
          <div class="mb-3">
            <label for="idNumeroFactura" class="form-label">No. Factura</label>
            <input
              type="text"
              class="form-control"
              id="idNumeroFactura"
              placeholder="FACT-00XXXXX"
              value="FACT-08122025"
            />
          </div>
        </div>
        <div class="col">
          <div class="mb-3">
            <label for="idIdentificacion" class="form-label"
              >Identificación</label
            >
            <input
              type="text"
              class="form-control"
              id="idIdentificacion"
              placeholder="XXXXXXXXXX"
              value="0951836592"
            />
          </div>
        </div>
        <div class="col">
          <div class="mb-3">
            <label for="idCajero" class="form-label">Cajero</label>
            <input
              type="text"
              class="form-control"
              id="idCajero"
              placeholder="Nombre del Cajero"
              value="Juan Pérez"
            />
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-sm-4">
          <div class="input-group">
            <input
              id="idProducto"
              type="text"
              class="form-control"
              placeholder="Buscar producto"
            />

            <button
              onclick="buscarAgregarProducto()"
              class="btn btn-outline-primary"
              type="button"
            >
              Buscar
            </button>
          </div>
        </div>
      </div>

      <br />

      <div class="row">
        <div id="idAlerta"></div>
      </div>

      <div class="row">
        <div class="col-sm-8">
          <table class="table table-hover">
            <thead>
              <tr>
                <th scope="col">Código</th>
                <th scope="col">Descripcion</th>
                <th scope="col">Cantidad</th>
                <th scope="col">Total</th>
                <th scope="col">Accion</th>
              </tr>
            </thead>
            <tbody id="idDetalle"></tbody>
          </table>
        </div>
        <div class="col-sm-4">
          <div id="menuPegajoso">
            <div class="mb-1">
              <label for="idSubtotal" class="form-label">SubTotal</label>
              <input
                type="text"
                class="form-control"
                id="idSubtotal"
                placeholder="$ 0.00"
                value="$ 0.00"
                style="
                  text-align: center;
                  background-color: black;
                  color: limegreen;
                  font-weight: bold;
                "
              />
            </div>
            <div class="mb-1">
              <label for="idIva" class="form-label">IVA 12%</label>
              <input
                readonly
                type="text"
                class="form-control"
                id="idIva"
                placeholder="$ 0.00"
                value="$ 0.00"
                style="
                  text-align: center;
                  background-color: black;
                  color: limegreen;
                  font-weight: bold;
                "
              />
            </div>
            <div class="mb-3">
              <label for="idTotal" class="form-label">Total</label>
              <input
                type="text"
                class="form-control"
                id="idTotal"
                placeholder="$ 0.00"
                value="$ 0.00"
                style="
                  text-align: center;
                  background-color: black;
                  color: limegreen;
                  font-weight: bold;
                "
              />
            </div>

            <div class="mb-3">
              <label for="idValorRecibido" class="form-label"
                >Valor Recibido</label
              >
              <input
                type="text"
                class="form-control"
                id="idValorRecibido"
                placeholder="0.00"
                value="0.00"
                style="
                  text-align: center;
                  background-color: black;
                  color: limegreen;
                  font-weight: bold;
                "
              />
            </div>

            <div class="mb-3">
              <label for="idCambio" class="form-label">Cambio</label>
              <input
                type="text"
                class="form-control"
                id="idCambio"
                placeholder="$ 0.00"
                value="$ 0.00"
                style="
                  text-align: center;
                  background-color: black;
                  color: limegreen;
                  font-weight: bold;
                "
              />
            </div>

            <div class="mb-3">
              <button
                disabled
                id="idBotonPago"
                class="btn btn-danger"
                style="width: 100%"
              >
                Pagar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
